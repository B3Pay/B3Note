[workspace]
resolver = "2"
members = ["backend", "mock_llm", "integration_tests"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/B3Pay/B3Note"

[workspace.dependencies]
candid = "0.10"
ic-cdk = "0.20"
ic-cdk-timers = "1.0"
ic-cdk-management-canister = "0.2"
ic-stable-structures = "0.7"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
